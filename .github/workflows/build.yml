name: Build PDF

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "cases/**"
      - "jd/**"
      - "projects/**"
      - "scripts/**"
      - "assets/png/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  TEXFILE: 把经历变成证据-初稿.tex
  PDFNAME: 把经历变成证据-初稿.pdf
  # fork 来的 PR 只有只读 token：能编译、能出 artifact，但不能推预览分支或回写 PDF
  SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # 机器人自己提交的 PDF 不再触发新一轮构建，避免死循环
      - name: Guard against bot commits
        id: guard
        run: |
          MSG=$(git log -1 --pretty=%s)
          echo "message=$MSG"
          if [[ "$MSG" == "[ci]"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "机器人提交，跳过构建"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install TeX Live, poppler, ImageMagick
        if: steps.guard.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-lang-chinese texlive-latex-extra \
            texlive-fonts-recommended texlive-lang-chinese lmodern \
            fonts-noto-cjk fonts-liberation poppler-utils imagemagick

      - name: Compile (two passes)
        if: steps.guard.outputs.skip != 'true'
        run: |
          xelatex -interaction=nonstopmode -halt-on-error "$TEXFILE"
          xelatex -interaction=nonstopmode -halt-on-error "$TEXFILE"
          ls -lh "$PDFNAME"

      - name: Check every character renders
        if: steps.guard.outputs.skip != 'true'
        run: |
          LOG=$(basename "$TEXFILE" .tex).log
          MISSING=$(grep -c 'Missing character' "$LOG" || true)
          echo "missing character warnings: $MISSING"
          if [ "$MISSING" != "0" ]; then
            grep -A1 'Missing character' "$LOG" | head -24
            echo "::error::有字符缺字形，PDF 里会是空白；检查字体是否覆盖这些字符"
            exit 1
          fi

          FONTS=$(pdffonts "$PDFNAME" | awk 'NR>2 {print $1}')
          echo "$FONTS"
          if ! echo "$FONTS" | grep -qiE 'CJK|Fandol|Noto|SimSun|Song|Hei'; then
            echo "::error::PDF 里没有中文字体，中文会是空白——检查是否装了 fonts-noto-cjk"
            exit 1
          fi

          if ! pdftotext "$PDFNAME" - | grep -q '把经历变成证据'; then
            echo "::error::PDF 里的中文提取不出来，可能渲染成了空白"
            exit 1
          fi

          echo "overfull hbox warnings: $(grep -c 'Overfull \hbox' "$LOG" || true)"

      - name: Render every page to PNG
        if: steps.guard.outputs.skip != 'true'
        run: |
          mkdir -p out/png
          pdftoppm -r 110 -png "$PDFNAME" out/png/page
          echo "pages: $(ls out/png | wc -l)"

      - name: Contact sheet
        if: steps.guard.outputs.skip != 'true'
        run: montage out/png/page-*.png -tile 10x -geometry 160x+4+4 -background white out/montage.png

      - name: Upload artifact
        if: steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: book-pdf
          path: |
            ${{ env.PDFNAME }}
            out/montage.png
            out/png/
          if-no-files-found: error

      # ---------- 同一个仓库的 PR：预览分支 + 评论 ----------
      - name: Publish preview branch
        if: steps.guard.outputs.skip != 'true' && github.event_name == 'pull_request' && env.SAME_REPO == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          TMP=$(mktemp -d); cd "$TMP"
          git init -q
          git remote add origin "https://x-access-token:$TOKEN@github.com/$REPO.git"
          git fetch --depth=1 origin preview 2>/dev/null || true
          git checkout -q preview 2>/dev/null || git checkout -q --orphan preview
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p "pr-$PR"
          cp -r "$GITHUB_WORKSPACE/out/png/." "pr-$PR/"
          cp "$GITHUB_WORKSPACE/out/montage.png" "pr-$PR/montage.png"
          {
            echo "<!doctype html><meta charset='utf-8'><title>PR #$PR</title>"
            echo "<h1>PR #$PR 预览</h1>"
            echo "<p><img src='montage.png' style='max-width:100%'></p><ul>"
            for f in pr-$PR/page-*.png; do b=$(basename "$f"); echo "<li><a href='$b'>$b</a></li>"; done
            echo "</ul>"
          } > "pr-$PR/index.html"
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -q -m "[ci] preview pr-$PR"
          git push -q -f origin preview

      - name: Comment preview on PR
        if: steps.guard.outputs.skip != 'true' && github.event_name == 'pull_request' && env.SAME_REPO == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          PAGES=$(ls out/png | wc -l)
          SIZE=$(du -h "$PDFNAME" | cut -f1)
          SHA=$(git rev-parse --short HEAD)
          PREFIX="https://raw.githubusercontent.com/$REPO/preview/pr-$PR"
          SAMPLE=$(ls out/png | awk 'NR%17==1' | head -6)
          {
            echo "## 编译通过 ✅"
            echo ""
            echo "| 页数 | PDF 大小 | 提交 |"
            echo "|---|---|---|"
            echo "| $PAGES | $SIZE | `$SHA` |"
            echo ""
            echo "![全部页面]($PREFIX/montage.png)"
            echo ""
            for p in $SAMPLE; do echo "![ $p ]($PREFIX/$p)"; done
            echo ""
            echo "<details><summary>全部 $PAGES 页（点开看单页 PNG）</summary><ul>"
            for p in $(ls out/png); do echo "<li><a href='$PREFIX/$p'>$p</a></li>"; done
            echo "</ul></details>"
            echo ""
            echo "完整 PDF 见 Actions 的 `book-pdf` artifact；编译好的 PDF 会自动提交回本分支。"
          } > comment.md
          gh pr comment "$PR" --repo "$REPO" --body-file comment.md

      - name: Note for fork PRs
        if: steps.guard.outputs.skip != 'true' && github.event_name == 'pull_request' && env.SAME_REPO != 'true'
        run: |
          echo "::notice::来自 fork 的 PR：只做编译检查与 artifact，预览与自动回写需要维护者合并后在 master 上生成。"

      # ---------- main：把 PDF 发到 Releases（滚动 latest） ----------
      - name: Publish rolling release
        if: steps.guard.outputs.skip != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PAGES=$(ls out/png | wc -l)
          SIZE=$(du -h "$PDFNAME" | cut -f1)
          SHA=${GITHUB_SHA:0:7}
          BUILD_TS=$(TZ=Asia/Shanghai date '+%Y-%m-%dT%H:%M:%S+08:00')
          NOTES="自动编译于 $BUILD_TS

          - 提交：\`$SHA\`
          - 页数：$PAGES
          - 文件：$SIZE"
          # 把 latest 标签强制移到本次提交，让 GitHub 自动生成的源码包跟着更新
          git tag -f latest "$GITHUB_SHA" >/dev/null
          git push -f origin refs/tags/latest >/dev/null 2>&1 || echo "标签移动失败（权限或分支保护）"

          # 另外自己打一份源码包，保证资产里的源码永远是这次构建的代码
          git archive --format=zip -o /tmp/campus2offer-src.zip HEAD

          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "最新编译版｜$PAGES 页｜$SHA｜$BUILD_TS" --notes "$NOTES" --latest
          else
            gh release create latest --title "最新编译版｜$PAGES 页｜$SHA｜$BUILD_TS" --notes "$NOTES" --latest
          fi
          cp "$PDFNAME" campus2offer-latest.pdf
          gh release upload latest campus2offer-latest.pdf --clobber
          gh release upload latest /tmp/campus2offer-src.zip --clobber
